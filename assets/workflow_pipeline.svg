<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; fill: #94a3b8; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
    .box-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; }
    .code-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 12.5px; fill: #38bdf8; }
    .token-pos { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #34d399; }
    .token-neg { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; font-weight: 700; fill: #f87171; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="520" fill="url(#pipeBg)"/>
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(50, 36)">
    <text x="0" y="0" class="title">Deep-Dive Workflow: Compound Contrastive Tweet Processing</text>
    <text x="0" y="24" class="subtitle">How the platform handles multi-aspect sentences that defeat conventional sentiment analysis tools.</text>
  </g>

  <!-- Step 1: Input Tweet -->
  <g transform="translate(50, 90)">
    <rect width="1100" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="24" class="box-title" fill="#38bdf8">RAW INPUT TWEET</text>
    <text x="20" y="48" class="code-text" font-size="14">"The camera is gorgeous, but the battery life is terrible 😭"</text>
    <rect x="910" y="16" width="170" height="32" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="925" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Mixed Sentiment Case</text>
  </g>

  <!-- Downward Arrows -->
  <path d="M 330 160 L 330 195" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 870 160 L 870 195" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: Clause Segmentation (ABSA) -->
  <g transform="translate(50, 200)">
    <!-- Left Clause: Positive Aspect -->
    <g transform="translate(0, 0)">
      <rect width="530" height="135" rx="8" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="12" width="130" height="22" rx="4" fill="#065f46" fill-opacity="0.4"/>
      <text x="24" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">CLAUSE A (POSITIVE)</text>
      <text x="16" y="58" class="code-text">Segment: "The camera is gorgeous"</text>
      <text x="16" y="84" class="box-sub">• Detected Aspect: <tspan font-weight="700" fill="#f8fafc">Camera / Optics</tspan></text>
      <text x="16" y="104" class="box-sub">• Clause Sentiment: <tspan font-weight="700" fill="#34d399">Positive (98.4% Confidence)</tspan></text>
      <text x="16" y="122" class="box-sub">• Sentiment Score: +0.94</text>
    </g>

    <!-- Center Contrastive Pivot -->
    <circle cx="550" cy="67" r="20" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="541" y="72" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">VS</text>

    <!-- Right Clause: Negative Aspect -->
    <g transform="translate(570, 0)">
      <rect width="530" height="135" rx="8" fill="url(#cardBg)" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="16" y="12" width="130" height="22" rx="4" fill="#991b1b" fill-opacity="0.4"/>
      <text x="24" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">CLAUSE B (NEGATIVE)</text>
      <text x="16" y="58" class="code-text">Segment: "battery life is terrible crying"</text>
      <text x="16" y="84" class="box-sub">• Detected Aspect: <tspan font-weight="700" fill="#f8fafc">Battery / Power</tspan></text>
      <text x="16" y="104" class="box-sub">• Clause Sentiment: <tspan font-weight="700" fill="#f87171">Negative (97.1% Confidence)</tspan></text>
      <text x="16" y="122" class="box-sub">• Sentiment Score: -0.92 (😭 translated to "crying")</text>
    </g>
  </g>

  <!-- Downward Arrows to LIME / GenAI -->
  <path d="M 315 340 L 315 375" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 885 340 L 885 375" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Step 3: LIME XAI & GenAI Insights Output -->
  <g transform="translate(50, 380)">
    <!-- LIME Feature Attribution Box -->
    <g transform="translate(0, 0)">
      <rect width="530" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" class="box-title">LIME Feature Attribution Weights</text>
      <!-- Green Positive Weights -->
      <text x="16" y="52" class="token-pos">"gorgeous": +0.48</text>
      <rect x="150" y="42" width="100" height="12" rx="3" fill="#10b981"/>

      <text x="16" y="74" class="token-pos">"camera": +0.14</text>
      <rect x="150" y="64" width="30" height="12" rx="3" fill="#10b981"/>

      <!-- Red Negative Weights -->
      <text x="290" y="52" class="token-neg">"terrible": -0.52</text>
      <rect x="420" y="42" width="95" height="12" rx="3" fill="#ef4444"/>

      <text x="290" y="74" class="token-neg">"crying": -0.26</text>
      <rect x="420" y="64" width="50" height="12" rx="3" fill="#ef4444"/>

      <text x="16" y="98" class="box-sub">Local linear surrogate model explains token impact on probability distribution.</text>
    </g>

    <!-- GenAI Executive Synthesis -->
    <g transform="translate(570, 0)">
      <rect width="530" height="110" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="16" y="24" class="box-title" fill="#c084fc">Gemini GenAI Executive Briefing Output</text>
      <text x="16" y="48" class="box-sub"><tspan font-weight="700" fill="#34d399">Praise Driver:</tspan> Users express strong visual satisfaction with optical sensors &amp; imaging.</text>
      <text x="16" y="68" class="box-sub"><tspan font-weight="700" fill="#f87171">Pain-Point Root Cause:</tspan> Severe battery drain during camera operation frustrates buyers.</text>
      <text x="16" y="88" class="box-sub"><tspan font-weight="700" fill="#38bdf8">Actionable Recommendation:</tspan> Prioritize firmware power optimization for image processing.</text>
    </g>
  </g>
</svg>
